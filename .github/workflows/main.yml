name: Build Noujiru Calendar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE"

      - name: Build APK
        working-directory: NoujiruCalendar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoujiruCalendar-debug
          path: NoujiruCalendar/app/build/outputs/apk/debug/*.apk
